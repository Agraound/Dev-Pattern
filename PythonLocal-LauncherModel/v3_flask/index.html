<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>App Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap');

    :root {
      --bg:      #0d0d0f;
      --panel:   #141418;
      --border:  #2a2a35;
      --accent:  #00ffa3;
      --accent2: #7b61ff;
      --text:    #e8e8f0;
      --muted:   #5a5a70;
      --danger:  #ff4d6d;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    header { text-align: center; }
    header h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.4rem;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.5rem 1.25rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.4s;
    }
    .dot.online  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 760px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem;
      transition: border-color 0.3s, transform 0.2s;
    }
    .card:hover { border-color: var(--accent2); transform: translateY(-3px); }
    .card-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
    }
    .card-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .card-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .response-box {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      min-height: 70px;
    }
    .response-box pre { white-space: pre-wrap; word-break: break-all; color: var(--accent); }

    .btn-row { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    button {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    button:hover  { opacity: 0.85; transform: scale(1.03); }
    button:active { transform: scale(0.97); }
    .btn-primary   { background: var(--accent); color: #0d0d0f; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }

    footer {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>App Launcher</h1>
    <p>http://127.0.0.1:5000 &nbsp;·&nbsp; index.html</p>
  </header>

  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="status-text">Conectando...</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Estado</div>
      <div class="card-value" id="api-status">—</div>
      <div class="card-sub">API Flask</div>
    </div>
    <div class="card">
      <div class="card-label">Ultimo heartbeat</div>
      <div class="card-value" id="last-ping">—</div>
      <div class="card-sub">HH:MM:SS</div>
    </div>
    <div class="card">
      <div class="card-label">Heartbeats enviados</div>
      <div class="card-value" id="ping-count">0</div>
      <div class="card-sub">desde el inicio</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-primary"   onclick="callAPI('/')">GET /</button>
    <button class="btn-secondary" onclick="callAPI('/api/saludo')">GET /api/saludo</button>
    <button class="btn-secondary" onclick="callAPI('/api/datos')">GET /api/datos</button>
  </div>

  <div class="response-box">
    <div id="resp-label" style="color:var(--muted);margin-bottom:.4rem">Respuesta</div>
    <pre id="resp-out">—</pre>
  </div>

  <footer>Cerrar esta ventana apaga el servidor &nbsp;|&nbsp; Ctrl+C en terminal tambien funciona</footer>

  <script>
    const API = "http://127.0.0.1:5000";
    let hbCount = 0;

    function now() {
      return new Date().toLocaleTimeString("es-AR", { hour12: false });
    }
    function setOnline(online, text) {
      document.getElementById("dot").className = "dot " + (online ? "online" : "offline");
      document.getElementById("status-text").textContent = text;
      document.getElementById("api-status").textContent  = online ? "online" : "offline";
    }
    function showResp(label, data) {
      document.getElementById("resp-label").textContent = label;
      document.getElementById("resp-out").textContent   = JSON.stringify(data, null, 2);
    }

    // ── Heartbeat cada 2 segundos ─────────────────────────────────────────────
    async function sendHeartbeat() {
      try {
        await fetch(API + "/launcher/heartbeat", { method: "POST", cache: "no-store" });
        hbCount++;
        document.getElementById("ping-count").textContent = hbCount;
        document.getElementById("last-ping").textContent  = now();
        setOnline(true, "API conectada · " + now());
      } catch {
        setOnline(false, "API no disponible");
      }
    }

    // ── Detectar recarga vs cierre real con sendBeacon ────────────────────────
    window.addEventListener("beforeunload", () => {
      navigator.sendBeacon(API + "/launcher/reload");
    });

    sendHeartbeat();
    setInterval(sendHeartbeat, 2000);

    // ── Llamadas manuales ─────────────────────────────────────────────────────
    async function callAPI(path) {
      try {
        const res  = await fetch(API + path, { cache: "no-store" });
        const data = await res.json();
        showResp("GET " + path, data);
      } catch (e) {
        showResp("Error", { error: e.message });
      }
    }

    // ── Web Lock: evita suspension de la pestana ──────────────────────────────
    if (navigator.locks) {
      navigator.locks.request("keep_alive", { mode: "shared" }, () => new Promise(() => {}));
    }
  </script>

</body>
</html>
